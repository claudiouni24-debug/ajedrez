<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajedrez</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --text:#2b2b2b; --muted:#777; --accent:#2e7d5b; --accent2:#256a4c;
    --light:#eeeed2; --dark:#6f9a58; --sel:rgba(255,215,0,.55); --last:rgba(255,235,59,.4); --border:#ddd6c7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1f1e1c; --panel:#2a2927; --text:#ecebe7; --muted:#a09d96; --border:#3e3c38; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:12px 16px;font-weight:700;font-size:20px}
  header span{color:var(--accent)}
  main{display:flex;flex-wrap:wrap;gap:16px;padding:0 16px 24px;justify-content:center;align-items:flex-start}
  .boardwrap{display:flex;gap:8px}
  #evalbar{width:22px;border-radius:4px;overflow:hidden;background:#222;position:relative;border:1px solid var(--border)}
  #evalfill{position:absolute;left:0;right:0;bottom:0;background:#f5f5f5;height:50%;transition:height .3s}
  #evaltxt{position:absolute;left:0;right:0;font-size:10px;text-align:center;font-weight:700;color:#888;top:50%;transform:translateY(-50%);mix-blend-mode:difference;color:#fff}
  #boardbox{position:relative;width:min(92vw,560px);aspect-ratio:1;user-select:none;touch-action:none}
  #board{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border-radius:4px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.25)}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sq.l{background:var(--light)} .sq.d{background:var(--dark)}
  .sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
  .sq.sel::before{content:"";position:absolute;inset:0;background:var(--sel)}
  .sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.2)}
  .sq.hint.cap::after{width:92%;height:92%;background:transparent;border:5px solid rgba(0,0,0,.2)}
  .sq.check{background:radial-gradient(circle,#ff4d4d 0,#ff4d4d 30%,transparent 75%),var(--c)}
  .sq .coord{position:absolute;font-size:10px;font-weight:700;opacity:.7;pointer-events:none}
  .sq .coord.r{top:2px;left:3px} .sq .coord.f{bottom:1px;right:3px}
  .sq.l .coord{color:var(--dark)} .sq.d .coord{color:var(--light)}
  .pc{width:92%;height:92%;background-size:contain;background-repeat:no-repeat;background-position:center;position:relative;z-index:2;pointer-events:none}
  .sq.pre::before{content:"";position:absolute;inset:0;background:rgba(220,40,40,.5)}
  .clock{font:700 20px ui-monospace,Consolas,monospace;padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--border);min-width:92px;text-align:center}
  .clock.run{background:var(--accent);color:#fff;border-color:var(--accent)}
  .clock.low{background:#c0392b;color:#fff;border-color:#c0392b}
  .clk{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
  .clk .nm{font-size:13px;color:var(--muted)}
  #chat{margin-top:10px}
  #chatlog{max-height:110px;overflow:auto;font-size:13px;margin-bottom:6px}
  #chatlog div{padding:2px 0} #chatlog .me{color:var(--accent)}
  #chatlog .sys{color:var(--muted);font-style:italic}
  #chatIn{width:100%;text-transform:none;letter-spacing:0;font-size:14px}
  #ghost{position:fixed;z-index:50;pointer-events:none;display:none;transform:translate(-50%,-50%)}
  #arrows{position:absolute;inset:0;pointer-events:none;z-index:5}
  #promo{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;border-radius:4px}
  #promo div{background:var(--panel);padding:10px;border-radius:10px;display:flex;gap:6px}
  #promo button{width:64px;height:64px;border:1px solid var(--border);background-color:var(--light);background-size:90%;background-repeat:no-repeat;background-position:center;border-radius:8px;cursor:pointer}
  aside{width:min(92vw,360px);display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;padding:10px 4px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  button.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px}
  button.btn:hover{border-color:var(--accent)}
  button.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.btn.pri:hover{background:var(--accent2)}
  button.btn:disabled{opacity:.45;cursor:default}
  input[type=text]{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);width:110px;font-size:15px;letter-spacing:2px;text-transform:uppercase}
  select{padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
  #status{font-weight:700;font-size:16px}
  #sub{color:var(--muted);font-size:13px;margin-top:4px;min-height:18px}
  .small{font-size:13px;color:var(--muted)}
  .line{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);cursor:default}
  .line:last-child{border:0}
  .line b{min-width:46px;text-align:right}
  .line span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #moves{max-height:150px;overflow:auto;font-size:14px;line-height:1.7}
  #moves .n{color:var(--muted);margin-left:6px}
  #moves a{padding:1px 4px;border-radius:4px}
  #moves a.cur{background:var(--accent);color:#fff}
  label.sw{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>♞ Ajedrez <span>· juega y estudia</span></header>
<main>
  <div class="boardwrap">
    <div id="evalbar"><div id="evalfill"></div><div id="evaltxt">0.0</div></div>
    <div style="display:flex;flex-direction:column"><div class="clk" id="clkTopRow"><span class="nm" id="nmTop"></span><div class="clock" id="clkTop">--:--</div></div>
    <div id="boardbox">
      <div id="board"></div>
      <svg id="arrows" viewBox="0 0 800 800"></svg>
      <div id="promo"><div id="promoBtns"></div></div>
    </div>
    <div class="clk" id="clkBotRow"><span class="nm" id="nmBot"></span><div class="clock" id="clkBot">--:--</div></div></div>
  </div>

  <aside>
    <div class="card">
      <div class="tabs">
        <button data-m="analysis" class="on">📖 Estudiar</button>
        <button data-m="cpu">🤖 Vs. PC</button>
        <button data-m="online">🌐 Online</button>
      </div>

      <div id="tcRow" class="row hidden"><label class="small">Reloj
          <select id="tc"><option value="0">Sin reloj</option><option value="1+0">1 min</option><option value="3+0">3 min</option><option value="3+2">3 + 2</option><option value="5+0" selected>5 min</option><option value="10+0">10 min</option><option value="15+10">15 + 10</option></select></label>
        <span class="small">Premove: arrastra en el turno rival · clic derecho cancela</span></div>
      <div id="opt-analysis" class="small" style="margin-top:10px">Mueve las piezas de ambos bandos y el motor te dice la mejor jugada.</div>

      <div id="opt-cpu" class="hidden">
        <div class="row">
          <label class="small">Nivel
            <select id="level">
              <option value="1">Principiante</option>
              <option value="5">Fácil</option>
              <option value="10" selected>Medio</option>
              <option value="15">Difícil</option>
              <option value="20">Máximo</option>
            </select></label>
          <label class="small">Juegas con
            <select id="color"><option value="w">Blancas</option><option value="b">Negras</option><option value="r">Al azar</option></select></label>
        </div>
        <div class="row"><button class="btn pri" id="startCpu">Nueva partida</button></div>
      </div>

      <div id="opt-online" class="hidden">
        <div class="row"><button class="btn pri" id="createRoom">Crear partida</button></div>
        <div class="row"><input type="text" id="joinCode" maxlength="5" placeholder="CÓDIGO"><button class="btn" id="joinRoom">Unirse</button></div>
        <div id="roomInfo" class="small" style="margin-top:10px"></div>
        <div id="chat" class="hidden"><div id="chatlog"></div><input type="text" id="chatIn" maxlength="200" placeholder="Escribe un mensaje y pulsa Enter"></div>
      </div>
    </div>

    <div class="card">
      <div id="status">Tu turno</div>
      <div id="sub"></div>
      <div class="row">
        <button class="btn" id="undo">↩ Deshacer</button>
        <button class="btn" id="flip">⇅ Girar</button>
        <button class="btn" id="resign">🏳 Rendirse</button>
        <button class="btn" id="reset">Reiniciar</button>
      </div>
    </div>

    <div class="card" id="analysisCard">
      <label class="sw"><input type="checkbox" id="anaOn" checked> Análisis en tiempo real (Stockfish)</label>
      <div class="small" id="engState" style="margin:6px 0">Cargando motor…</div>
      <div id="lines"></div>
    </div>

    <div class="card">
      <div id="moves"><span class="small">Aún no hay jugadas</span></div>
      <div class="row">
        <button class="btn" id="copyPgn">Copiar PGN</button>
        <button class="btn" id="copyFen">Copiar FEN</button>
        <button class="btn" id="loadFen">Cargar FEN</button>
      </div>
    </div>
  </aside>
</main>
<div id="ghost" class="pc"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ================= Estado ================= */
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
let game=new Chess();
let mode='analysis';           // analysis | cpu | online
let myColor='w';               // color del jugador (cpu/online)
let orientation='w';
let sel=null, lastMove=null, gameOver=false;
let viewIndex=null;            // null = posición actual
let cpuLevel=10, online={peer:null,conn:null,ready:false,host:false,lastSeen:0,stale:false};

const pieceUrl=(c,t)=>'url(pieces/'+c+t.toUpperCase()+'.svg)';
let premove=null;
const $=id=>document.getElementById(id);
const boardEl=$('board');

/* ================= Tablero ================= */
function sqName(f,r){return 'abcdefgh'[f]+(r+1);}
function render(){
  const g=game, b=g.board();
  boardEl.innerHTML='';
  const kingInCheck=g.in_check()?findKing(g.turn()):null;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const rank=orientation==='w'?7-i:i, file=orientation==='w'?j:7-j;
    const name=sqName(file,rank), cell=b[7-rank][file];
    const d=document.createElement('div');
    const light=(file+rank)%2===1;
    d.className='sq '+(light?'l':'d');
    d.dataset.sq=name;
    d.style.setProperty('--c',light?'var(--light)':'var(--dark)');
    if(lastMove&&(lastMove.from===name||lastMove.to===name))d.classList.add('last');
    if(sel===name)d.classList.add('sel');
    if(premove&&(premove.from===name||premove.to===name))d.classList.add('pre');
    if(kingInCheck===name)d.classList.add('check');
    if(sel){
      const m=g.moves({square:sel,verbose:true}).find(m=>m.to===name);
      if(m){d.classList.add('hint');if(cell)d.classList.add('cap');}
    }
    if(j===0){const c=document.createElement('span');c.className='coord r';c.textContent=rank+1;d.appendChild(c);}
    if(i===7){const c=document.createElement('span');c.className='coord f';c.textContent='abcdefgh'[file];d.appendChild(c);}
    if(cell){const p=document.createElement('div');p.className='pc';p.style.backgroundImage=pieceUrl(cell.color,cell.type);p.id='pc-'+name;d.appendChild(p);}
    boardEl.appendChild(d);
  }
  drawArrows();
}
function findKing(color){
  const b=game.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const c=b[r][f];if(c&&c.type==='k'&&c.color===color)return sqName(f,7-r);}
}
function canMove(color){
  if(gameOver||viewIndex!==null)return false;
  if(mode==='analysis')return true;
  if(mode==='cpu')return color===myColor&&game.turn()===myColor&&!cpuBusy;
  if(mode==='online')return online.ready&&color===myColor&&game.turn()===myColor;
}
function canPremove(color){
  if(gameOver||viewIndex!==null||mode==='analysis'||color!==myColor||game.turn()===myColor)return false;
  return mode==='cpu'||(mode==='online'&&online.ready);
}
function sqFromPoint(x,y){
  const r=boardEl.getBoundingClientRect();
  const j=Math.floor((x-r.left)/r.width*8), i=Math.floor((y-r.top)/r.height*8);
  if(j<0||j>7||i<0||i>7)return null;
  return sqName(orientation==='w'?j:7-j, orientation==='w'?7-i:i);
}

/* Interacción: clic o arrastre */
let drag=null;
boardEl.addEventListener('pointerdown',e=>{
  const sq=sqFromPoint(e.clientX,e.clientY); if(!sq)return;
  const piece=game.get(sq);
  if(e.button===2){return;}
  if(sel&&sel!==sq&&attempt(sel,sq)){return;}
  if(piece&&((canMove(piece.color)&&piece.color===game.turn())||canPremove(piece.color))){
    sel=sq;render();
    drag={from:sq,x:e.clientX,y:e.clientY,moved:false,piece};
    boardEl.setPointerCapture(e.pointerId);
  }else{sel=null;premove=null;render();}
});
boardEl.addEventListener('contextmenu',e=>{e.preventDefault();premove=null;sel=null;render();});
boardEl.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  if(!drag.moved){
    drag.moved=true;
    const g=$('ghost');g.className='pc';g.style.backgroundImage=pieceUrl(drag.piece.color,drag.piece.type);g.style.width=g.style.height=(boardEl.clientWidth/8*.9)+'px';
    g.style.display='block';
    const o=$('pc-'+drag.from);if(o)o.style.opacity=.3;
  }
  const g=$('ghost');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
});
boardEl.addEventListener('pointerup',e=>{
  if(!drag)return;
  const d=drag;drag=null;$('ghost').style.display='none';
  if(d.moved){
    const to=sqFromPoint(e.clientX,e.clientY);
    if(to&&to!==d.from&&attempt(d.from,to))return;
    sel=null;render();
  }
});
function attempt(from,to){
  const p=game.get(from);
  if(p&&canPremove(p.color)){premove={from,to};sel=null;render();return true;}
  return tryMove(from,to);
}
function tryMove(from,to){
  const moves=game.moves({square:from,verbose:true}).filter(m=>m.to===to);
  if(!moves.length)return false;
  if(moves[0].promotion){askPromotion(moves[0].color,p=>doMove(from,to,p));return true;}
  doMove(from,to);return true;
}
function askPromotion(color,cb){
  const box=$('promoBtns');box.innerHTML='';
  for(const p of ['q','r','b','n']){
    const b=document.createElement('button');b.style.backgroundImage=pieceUrl(color,p);
    b.onclick=()=>{$('promo').style.display='none';cb(p);};
    box.appendChild(b);
  }
  $('promo').style.display='flex';
}

/* ================= Jugadas ================= */
function doMove(from,to,promotion,remote){
  clockTick();
  const m=game.move({from,to,promotion:promotion||'q'});
  if(!m)return;
  lastMove={from:m.from,to:m.to};sel=null;viewIndex=null;
  if(clock.on){ if(game.history().length>=3)clock[m.color]+=clock.inc; clock.ts=performance.now(); }
  if(mode==='online'&&!remote&&online.conn&&online.conn.open)online.conn.send({t:'move',from,to,promotion:m.promotion||null,n:game.history().length});
  afterMove();
}
function afterMove(){
  checkEnd();render();updateStatus();renderMoves();
  if(gameOver){premove=null;return stopAnalysis();}
  if(premove&&mode!=='analysis'&&game.turn()===myColor){
    const pm=premove;premove=null;
    if(game.moves({verbose:true}).some(x=>x.from===pm.from&&x.to===pm.to)){
      setTimeout(()=>{ if(!gameOver&&game.turn()===myColor)doMove(pm.from,pm.to,'q'); },60);
      return;
    }
    render();
  }
  if(mode==='cpu'&&game.turn()!==myColor)cpuPlay();
  else refreshAnalysis();
}
function checkEnd(){
  if(game.game_over()){
    gameOver=true;
    let t='';
    if(game.in_checkmate())t='Jaque mate · ganan '+(game.turn()==='w'?'las negras':'las blancas');
    else if(game.in_stalemate())t='Tablas por ahogado';
    else if(game.in_threefold_repetition())t='Tablas por repetición';
    else if(game.insufficient_material())t='Tablas por material insuficiente';
    else t='Tablas';
    gameOver=t;
  }
}
function updateStatus(){
  drawClock();
  let s,sub='';
  if(gameOver){s=gameOver;}
  else{
    const turn=game.turn()==='w'?'blancas':'negras';
    if(mode==='analysis')s='Mueven '+turn;
    else if(game.turn()===myColor)s='Tu turno';
    else s=mode==='cpu'?'Pensando…':'Turno del rival';
    if(game.in_check())sub='¡Jaque!';
  }
  $('status').textContent=s;$('sub').textContent=sub;
  $('undo').disabled=mode==='online'||game.history().length===0;
  $('resign').classList.toggle('hidden',mode==='analysis');
  $('reset').classList.toggle('hidden',mode==='online');
}
function renderMoves(){
  const h=(savedGame||game).history(),box=$('moves');
  if(!h.length){box.innerHTML='<span class="small">Aún no hay jugadas</span>';return;}
  let html='';
  h.forEach((m,i)=>{
    if(i%2===0)html+='<span class="n">'+(i/2+1)+'.</span>';
    const cur=(viewIndex===null?i===h.length-1:i===viewIndex);
    html+=' <a data-i="'+i+'" class="'+(cur?'cur':'')+'" style="cursor:pointer">'+m+'</a>';
  });
  box.innerHTML=html;
  const c=box.querySelector('.cur');if(c)c.scrollIntoView({block:'nearest'});
}
$('moves').addEventListener('click',e=>{
  const i=e.target.dataset&&e.target.dataset.i;if(i===undefined)return;
  gotoMove(+i);
});
/* revisar jugadas pasadas (sólo lectura) */
let savedGame=null;   // partida completa mientras se revisa una posición pasada
function gotoMove(i){
  const full=savedGame||game, hist=full.history({verbose:true});
  if(!hist.length)return;
  i=Math.max(-1,Math.min(i,hist.length-1));
  if(i===hist.length-1){            // volver a la posición actual
    if(savedGame){game=savedGame;savedGame=null;}
    viewIndex=null;
  }else{
    if(!savedGame)savedGame=game;
    const g=new Chess();for(let k=0;k<=i;k++)g.move(hist[k].san);
    game=g;viewIndex=i;
  }
  const t=i>=0?hist[i]:null;
  lastMove=t?{from:t.from,to:t.to}:null;sel=null;
  render();updateStatus();renderMoves();refreshAnalysis();
}

/* ================= Motor Stockfish ================= */
const SF_URL='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
let sf=null,sfReady=false,sfBusy=false,sfPending=null,sfCurrent=null,cpuBusy=false;
const anaLines={};
async function initEngine(){
  try{
    const code=await (await fetch(SF_URL)).text();
    sf=new Worker(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
    sf.onmessage=e=>onEngine(typeof e.data==='string'?e.data:String(e.data));
    sf.postMessage('uci');
  }catch(err){
    $('engState').textContent='No se pudo cargar el motor (¿hay conexión a internet?).';
  }
}
function send(c){sf&&sf.postMessage(c);}
function runJob(job){      // job: {kind:'play'|'ana', fen, level}
  sfPending=job;
  if(sfBusy){send('stop');return;}
  startJob();
}
function startJob(){
  const job=sfPending;if(!job||!sfReady)return;
  sfPending=null;sfCurrent=job;sfBusy=true;
  send('setoption name Skill Level value '+(job.kind==='play'?job.level:20));
  send('setoption name MultiPV value '+(job.kind==='play'?1:3));
  send('position fen '+job.fen);
  send(job.kind==='play'?'go movetime '+(300+job.level*60):'go depth 24');
  if(job.kind==='ana'){for(const k in anaLines)delete anaLines[k];}
}
function onEngine(line){
  if(line==='uciok'){send('isready');return;}
  if(line==='readyok'){sfReady=true;$('engState').textContent='Motor listo ✓';refreshAnalysis();if(sfPending)startJob();return;}
  if(line.startsWith('bestmove')){
    const job=sfCurrent;sfBusy=false;sfCurrent=null;
    if(sfPending){startJob();return;}
    if(job&&job.kind==='play'){
      const mv=line.split(' ')[1];cpuBusy=false;
      if(job.fen===game.fen()&&mode==='cpu'&&!gameOver)doMove(mv.slice(0,2),mv.slice(2,4),mv[4]);
    }
    return;
  }
  if(line.startsWith('info')&&sfCurrent&&sfCurrent.kind==='ana'&&line.includes(' pv ')){
    const mp=+(/multipv (\d+)/.exec(line)||[0,1])[1];
    const depth=+(/depth (\d+)/.exec(line)||[0,0])[1];
    const cp=/score cp (-?\d+)/.exec(line),mate=/score mate (-?\d+)/.exec(line);
    const pv=line.split(' pv ')[1].trim().split(' ');
    const turn=sfCurrent.fen.split(' ')[1];
    const sign=turn==='w'?1:-1;
    anaLines[mp]={depth,pv,cp:cp?sign*+cp[1]:null,mate:mate?sign*+mate[1]:null,fen:sfCurrent.fen};
    showAnalysis();
  }
}
function analysisAllowed(){
  if(!$('anaOn').checked||mode==='online')return false;
  if(mode==='cpu'&&game.turn()!==myColor&&!gameOver)return false;
  return true;
}
function refreshAnalysis(){
  $('analysisCard').classList.toggle('hidden',mode==='online');
  $('evalbar').style.visibility=mode==='online'?'hidden':'visible';
  if(!analysisAllowed()||gameOver){stopAnalysis(true);return;}
  if(!sfReady)return;
  runJob({kind:'ana',fen:game.fen()});
}
function stopAnalysis(clear){
  if(sfCurrent&&sfCurrent.kind==='ana'){sfPending=null;send('stop');}
  if(sfPending&&sfPending.kind==='ana')sfPending=null;
  if(clear!==false){$('lines').innerHTML='';setEval(null);drawArrows();for(const k in anaLines)delete anaLines[k];}
}
function cpuPlay(){
  cpuBusy=true;$('lines').innerHTML='';setEval(null);drawArrows();
  if(!sfReady){setTimeout(cpuPlay,300);return;}
  runJob({kind:'play',fen:game.fen(),level:cpuLevel});
}
function fmtScore(l){
  if(l.mate!==null)return (l.mate>0?'+':'-')+'M'+Math.abs(l.mate);
  const v=l.cp/100;return (v>0?'+':'')+v.toFixed(1);
}
function setEval(l){
  const fill=$('evalfill'),t=$('evaltxt');
  if(!l){fill.style.height='50%';t.textContent='0.0';return;}
  let pct=l.mate!==null?(l.mate>0?100:0):100/(1+Math.exp(-l.cp/250));
  if(orientation==='b')fill.style.top='0',fill.style.bottom='auto',fill.style.height=(100-pct)+'%';
  else fill.style.bottom='0',fill.style.top='auto',fill.style.height=pct+'%';
  t.textContent=fmtScore(l).replace('+','');
}
function showAnalysis(){
  const box=$('lines');box.innerHTML='';
  const keys=Object.keys(anaLines).sort();
  keys.forEach(k=>{
    const l=anaLines[k];
    const g=new Chess(l.fen),san=[];
    for(const u of l.pv.slice(0,7)){
      const m=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});if(!m)break;san.push(m.san);
    }
    const d=document.createElement('div');d.className='line';
    d.innerHTML='<b>'+fmtScore(l)+'</b><span>'+san.join(' ')+' <i>(p'+l.depth+')</i></span>';
    box.appendChild(d);
  });
  if(anaLines[1])setEval(anaLines[1]);
  drawArrows();
}
function drawArrows(){
  const svg=$('arrows');svg.innerHTML='';
  const l=anaLines[1];if(!l||!analysisAllowed()||l.fen!==game.fen())return;
  const colors=['rgba(46,125,91,.85)','rgba(60,120,200,.55)','rgba(200,140,40,.5)'];
  [3,2,1].forEach(k=>{
    const a=anaLines[k];if(!a)return;
    const u=a.pv[0];
    const pt=s=>{const f='abcdefgh'.indexOf(s[0]),r=+s[1]-1;
      return [(orientation==='w'?f:7-f)*100+50,(orientation==='w'?7-r:r)*100+50];};
    const [x1,y1]=pt(u.slice(0,2)),[x2,y2]=pt(u.slice(2,4));
    const ang=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1)-28;
    const ex=x1+Math.cos(ang)*len,ey=y1+Math.sin(ang)*len,w=k===1?16:10;
    svg.insertAdjacentHTML('beforeend',
      '<line x1="'+x1+'" y1="'+y1+'" x2="'+ex+'" y2="'+ey+'" stroke="'+colors[k-1]+'" stroke-width="'+w+'" stroke-linecap="round"/>'+
      '<polygon fill="'+colors[k-1]+'" points="'+
      (x2)+','+(y2)+' '+(ex-Math.sin(ang)*22)+','+(ey+Math.cos(ang)*22)+' '+(ex+Math.sin(ang)*22)+','+(ey-Math.cos(ang)*22)+'"/>');
  });
}

/* ================= Modos ================= */
function newGame(fen){
  game=new Chess(fen||undefined);savedGame=null;viewIndex=null;
  sel=null;lastMove=null;gameOver=false;cpuBusy=false;premove=null;resetClock();
  for(const k in anaLines)delete anaLines[k];
  if(sfCurrent&&sfCurrent.kind==='play'){sfPending=null;send('stop');}
  render();updateStatus();renderMoves();
  if(mode==='cpu'&&game.turn()!==myColor)cpuPlay();else refreshAnalysis();
}
function setMode(m){
  if(m!=='online')closeOnline();
  mode=m;
  $('tcRow').classList.toggle('hidden',m==='analysis');$('chat').classList.add('hidden');
  if(m!=='analysis')tcValue=$('tc').value;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  ['analysis','cpu','online'].forEach(x=>$('opt-'+x).classList.toggle('hidden',x!==m));
  $('opt-analysis').classList.toggle('hidden',m!=='analysis');
  if(m==='analysis'){orientation='w';myColor='w';newGame();}
  if(m==='cpu')startCpu();
  if(m==='online'){orientation='w';myColor='w';online.ready=false;newGame();$('status').textContent='Crea o únete a una partida';}
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

function startCpu(){
  cpuLevel=+$('level').value;
  let c=$('color').value;if(c==='r')c=Math.random()<.5?'w':'b';
  myColor=c;orientation=c;tcValue=$('tc').value;newGame();
}
$('startCpu').onclick=startCpu;
$('level').onchange=()=>{cpuLevel=+$('level').value;};

$('undo').onclick=()=>{
  if(mode==='online')return;
  if(viewIndex!==null)gotoMove(game.history().length);
  if(mode==='cpu'){ // deshacer hasta que sea tu turno
    if(sfCurrent&&sfCurrent.kind==='play'){sfPending=null;send('stop');}cpuBusy=false;
    game.undo();if(game.turn()!==myColor)game.undo();
  }else game.undo();
  gameOver=false;const h=game.history({verbose:true});
  lastMove=h.length?{from:h[h.length-1].from,to:h[h.length-1].to}:null;
  sel=null;render();updateStatus();renderMoves();refreshAnalysis();
};
$('flip').onclick=()=>{orientation=orientation==='w'?'b':'w';render();setEval(anaLines[1]||null);};
$('reset').onclick=()=>{
  if(mode==='cpu')startCpu();else newGame();
};
$('resign').onclick=()=>{
  if(gameOver||!confirm('¿Seguro que quieres rendirte?'))return;
  premove=null;gameOver='Te rendiste · ganan '+(myColor==='w'?'las negras':'las blancas');
  if(mode==='online'&&online.conn)online.conn.send({t:'resign'});
  stopAnalysis();updateStatus();
};
$('anaOn').onchange=()=>refreshAnalysis();

/* ================= Reloj ================= */
let clock={on:false,w:0,b:0,inc:0,ts:0}, tcValue='0';
function resetClock(){
  const on=mode!=='analysis'&&tcValue!=='0';
  if(on){const [m,i]=tcValue.split('+').map(Number);clock={on:true,w:m*60000,b:m*60000,inc:i*1000,ts:performance.now()};}
  else clock={on:false,w:0,b:0,inc:0,ts:0};
  drawClock();
}
function clockTick(){
  if(!clock.on||gameOver)return;
  const now=performance.now(),full=(savedGame||game);
  if(full.history().length<2){clock.ts=now;return;}
  if(viewIndex!==null){clock.ts=now;return;}
  clock[game.turn()]-=now-clock.ts;clock.ts=now;
  for(const c of ['w','b'])if(clock[c]<=0){
    clock[c]=0;
    gameOver='Se acabó el tiempo · ganan '+(c==='w'?'las negras':'las blancas');
    premove=null;if(mode==='online'&&online.conn)try{online.conn.send({t:'timeout',color:c});}catch(e){}
    stopAnalysis();updateStatus();break;
  }
}
function fmt(ms){
  const t=Math.max(0,ms)/1000;
  if(t<10)return '0:0'+t.toFixed(1);
  return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
}
function drawClock(){
  $('clkTopRow').classList.toggle('hidden',!clock.on);$('clkBotRow').classList.toggle('hidden',!clock.on);
  if(!clock.on)return;
  const top=orientation==='w'?'b':'w',bot=orientation;
  const set=(el,c)=>{
    el.textContent=fmt(clock[c]);
    const running=!gameOver&&(savedGame||game).history().length>=2&&game.turn()===c;
    el.className='clock'+(running?' run':'')+(clock[c]<10000?' low':'');
  };
  set($('clkTop'),top);set($('clkBot'),bot);
  const nm=c=>mode==='cpu'?(c===myColor?'Tú':'Stockfish'):mode==='online'?(c===myColor?'Tú':'Rival'):'';
  $('nmTop').textContent=nm(top);$('nmBot').textContent=nm(bot);
}
setInterval(()=>{clockTick();drawClock();},100);
$('tc').onchange=()=>{tcValue=$('tc').value;if(mode==='cpu')startCpu();};

function chatAdd(text,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=text;$('chatlog').appendChild(d);$('chatlog').scrollTop=1e9;}
$('chatIn').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!$('chatIn').value.trim()||!online.conn)return;
  const t=$('chatIn').value.trim();online.conn.send({t:'chat',text:t});chatAdd('Tú: '+t,'me');$('chatIn').value='';
});

/* ================= Online (WebRTC con PeerJS) ================= */
const PREFIX='ajedrezfacil-';
function code5(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function closeOnline(){
  try{online.conn&&online.conn.close();}catch(e){}
  try{online.peer&&online.peer.destroy();}catch(e){}
  online={peer:null,conn:null,ready:false,host:false,lastSeen:0,stale:false};
  $('roomInfo').innerHTML='';
}
function info(h){$('roomInfo').innerHTML=h;}
/* ---- conexión robusta: reconexión, resincronización y latido ---- */
function fullGame(){return savedGame||game;}
function connInfo(warn){
  info((warn?'<b style="color:#c0392b">'+warn+'</b><br>':'✅ Conectado. ')+'Juegas con '+(myColor==='w'?'blancas':'negras')+'.<br><button class="btn" id="rematch" style="margin-top:6px">Revancha</button>');
  $('rematch').onclick=()=>online.conn&&online.conn.open&&online.conn.send({t:'rematch'});
}
function sendState(withColor){
  clockTick();
  const d={t:'state',moves:fullGame().history(),w:clock.w,b:clock.b,over:gameOver||null};
  if(withColor){d.color=myColor==='w'?'b':'w';d.tc=tcValue;}
  online.conn.send(d);
}
function applyState(d){
  if(d.color){myColor=d.color;orientation=myColor;}
  if(d.tc!==undefined){tcValue=d.tc;$('tc').value=tcValue;}
  const g=new Chess();
  for(const m of d.moves){if(!g.move(m))break;}
  game=g;savedGame=null;viewIndex=null;sel=null;premove=null;gameOver=false;cpuBusy=false;
  const h=g.history({verbose:true});lastMove=h.length?{from:h[h.length-1].from,to:h[h.length-1].to}:null;
  resetClock();
  if(clock.on&&d.w!==undefined){clock.w=d.w;clock.b=d.b;clock.ts=performance.now();}
  online.ready=true;
  checkEnd();if(d.over&&!gameOver)gameOver=d.over;
  $('chat').classList.remove('hidden');connInfo();
  render();updateStatus();renderMoves();
}
function attach(conn){
  if(online.conn&&online.conn!==conn){try{online.conn.close();}catch(e){}}
  online.conn=conn;online.lastSeen=Date.now();online.stale=false;
  conn.on('open',()=>{
    if(conn!==online.conn||!online.host)return;
    if(fullGame().history().length>0){      // el rival volvió: retomar la partida donde iba
      online.ready=true;sendState(true);connInfo();
      chatAdd('El rival volvió a la partida.','sys');
    }else{
      myColor=Math.random()<.5?'w':'b';
      conn.send({t:'start',color:myColor==='w'?'b':'w',tc:tcValue});
      beginOnline();
    }
  });
  conn.on('data',d=>{
    if(conn!==online.conn)return;
    online.lastSeen=Date.now();
    if(online.stale){online.stale=false;if(online.ready)connInfo();conn.send({t:'sync'});}
    if(d.t==='ping')return;
    if(d.t==='start'){myColor=d.color;tcValue=d.tc||'0';$('tc').value=tcValue;beginOnline();}
    else if(d.t==='state')applyState(d);
    else if(d.t==='sync')sendState(false);
    else if(d.t==='chat')chatAdd('Rival: '+d.text);
    else if(d.t==='timeout'&&!gameOver){clock[d.color]=0;gameOver='Se acabó el tiempo · ganan '+(d.color==='w'?'las negras':'las blancas');premove=null;stopAnalysis();updateStatus();}
    else if(d.t==='move'){
      if(gameOver)return;
      if(viewIndex!==null)gotoMove(1e6);
      const ok=game.moves({verbose:true}).some(m=>m.from===d.from&&m.to===d.to);
      if(!ok||(d.n!==undefined&&d.n!==game.history().length+1)){conn.send({t:'sync'});return;}   // desfase: pedir estado
      doMove(d.from,d.to,d.promotion||undefined,true);
    }
    else if(d.t==='resign'){gameOver='El rival se rindió · ¡ganaste!';premove=null;stopAnalysis();updateStatus();}
    else if(d.t==='rematch'){ if(confirm('El rival propone la revancha. ¿Aceptas?')){ if(online.host)swap(); else conn.send({t:'rematchOk'}); } }
    else if(d.t==='rematchOk'){ if(online.host)swap(); }
    else if(d.t==='swap'){myColor=d.color;orientation=myColor;newGame();connInfo();}
  });
  conn.on('close',()=>{
    if(conn!==online.conn)return;          // una conexión vieja que ya reemplazamos
    online.ready=false;connInfo('⚠ Rival desconectado. Si vuelve a abrir el enlace, retomará la partida.');updateStatus();
  });
  conn.on('error',()=>{if(conn===online.conn&&online.ready)connInfo('⚠ Problema de conexión…');});
}
setInterval(()=>{
  const c=online.conn;if(mode!=='online'||!c||!c.open)return;
  try{c.send({t:'ping'});}catch(e){}
  if(online.ready&&Date.now()-online.lastSeen>12000&&!online.stale){online.stale=true;connInfo('⚠ Conexión inestable…');}
},2000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&mode==='online'&&online.conn&&online.conn.open&&online.ready)online.conn.send({t:'sync'});
});
function swap(){
  if(online.host){myColor=myColor==='w'?'b':'w';online.conn.send({t:'swap',color:myColor==='w'?'b':'w'});orientation=myColor;newGame();connInfo();}
}
function beginOnline(){
  online.ready=true;orientation=myColor;$('chat').classList.remove('hidden');$('chatlog').innerHTML='';chatAdd('Conectado con tu rival. ¡Buena suerte!','sys');newGame();
  connInfo();
}
$('createRoom').onclick=()=>{
  closeOnline();tcValue=$('tc').value;
  const code=code5();
  const peer=new Peer(PREFIX+code);
  online.peer=peer;online.host=true;
  info('Creando sala…');
  peer.on('open',()=>{
    const link=location.href.split('#')[0]+'#'+code;
    info('Código: <b style="font-size:22px;letter-spacing:3px">'+code+'</b><br>Díselo a tu rival, o envía este enlace:<br><input type="text" readonly style="width:100%;text-transform:none;letter-spacing:0;font-size:12px" value="'+link+'" onclick="this.select()"><br>Esperando al rival…');
  });
  peer.on('connection',attach);
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>info('Error: '+e.type+(e.type==='unavailable-id'?' — vuelve a intentarlo.':'')));
};
function joinRoom(code){
  closeOnline();
  code=code.trim().toUpperCase();if(!code)return;
  const peer=new Peer();online.peer=peer;online.host=false;
  info('Conectando a '+code+'…');
  peer.on('open',()=>{attach(peer.connect(PREFIX+code,{reliable:true}));});
  peer.on('error',e=>info(e.type==='peer-unavailable'?'No existe esa sala. Revisa el código.':'Error: '+e.type));
}
$('joinRoom').onclick=()=>joinRoom($('joinCode').value);

/* ================= Utilidades ================= */
function copy(t,btn){navigator.clipboard.writeText(t).then(()=>{const o=btn.textContent;btn.textContent='¡Copiado!';setTimeout(()=>btn.textContent=o,1200);});}
$('copyPgn').onclick=e=>copy((savedGame||game).pgn(),e.target);
$('copyFen').onclick=e=>copy(game.fen(),e.target);
$('loadFen').onclick=()=>{
  const f=prompt('Pega una posición en formato FEN:');if(!f)return;
  const g=new Chess();if(!g.load(f)){alert('FEN no válido');return;}
  if(mode==='online')return;
  newGame(f);
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const n=(savedGame||game).history().length;
  if(e.key==='ArrowLeft'){gotoMove((viewIndex===null?n-1:viewIndex)-1);}
  if(e.key==='ArrowRight'&&viewIndex!==null){gotoMove(viewIndex+1);}
});

/* ================= Inicio ================= */
render();updateStatus();initEngine();
function joinFromHash(){
  if(location.hash.length>1){setMode('online');$('joinCode').value=location.hash.slice(1,6).toUpperCase();joinRoom(location.hash.slice(1,6));}
}
joinFromHash();
window.addEventListener('hashchange',joinFromHash);
</script>
